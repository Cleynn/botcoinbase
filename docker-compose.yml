# TradingDots Phase 1. Only Caddy publishes host ports (TCP 80 and 443).
# Prometheus and Grafana are PLACEHOLDERS behind the "monitoring" profile (off by default).
name: tradingdots

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  caddy:
    <<: *hardening
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    cap_add: [NET_BIND_SERVICE]
    environment:
      TD_APP_HOSTNAME: ${TD_APP_HOSTNAME:?set in .env}
      TD_GRAFANA_HOSTNAME: ${TD_GRAFANA_HOSTNAME:?set in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ["/tmp:size=16m"]
    read_only: true
    networks: [edge_public, edge_app, edge_grafana]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      # Validates configuration only; Caddy exposes no admin API or health endpoint.
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3
    mem_limit: 128m
    pids_limit: 100

  # One-shot: creates/refreshes the runtime DB roles and applies migrations as the DB owner.
  # Only this service (and postgres) ever sees the owner password.
  migrate:
    <<: *hardening
    restart: "no"
    build: *app-build
    image: tradingdots-app:phase4
    user: "10001:10001"
    command: ["python", "-m", "app.storage.database", "migrate"]
    environment:
      TD_ENVIRONMENT: ${TD_ENVIRONMENT:-production}
      TD_DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TD_DB_APP_PASSWORD: ${TD_DB_APP_PASSWORD:?set in .env}
      TD_DB_CTL_PASSWORD: ${TD_DB_CTL_PASSWORD:?set in .env}
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 256m
    pids_limit: 100

  app:
    <<: *hardening
    build: *app-build
    image: tradingdots-app:phase4
    user: "10001:10001"
    expose: ["8000"]
    environment:
      TD_ENVIRONMENT: ${TD_ENVIRONMENT:-production}
      TD_DEBUG: ${TD_DEBUG:-false}
      TD_PROFILE: ${TD_PROFILE:-backtest}
      TD_APP_HOSTNAME: ${TD_APP_HOSTNAME:?set in .env}
      TD_GRAFANA_HOSTNAME: ${TD_GRAFANA_HOSTNAME:?set in .env}
      TD_SECRET_KEY: ${TD_SECRET_KEY:?set in .env}
      TD_DB_USER: td_app
      TD_DB_PASSWORD: ${TD_DB_APP_PASSWORD:?set in .env}
      # Internal metrics listener: bound to this static address on mon_scrape only, never published.
      TD_METRICS_BIND: 172.29.20.10
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    volumes:
      - review_packages:/review:ro   # protected package downloads read from here, never write
    networks:
      edge_app: {}
      backend: {}
      mon_scrape:
        ipv4_address: 172.29.20.10
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 200

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    user: "70:70"
    environment:
      POSTGRES_DB: tradingdots
      POSTGRES_USER: tradingdots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    tmpfs: ["/tmp:size=64m", "/var/run/postgresql:size=1m"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingdots -d tradingdots"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    pids_limit: 200

  redis:
    <<: *hardening
    image: redis:7-alpine
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --protected-mode yes --appendonly yes --save ""
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    pids_limit: 100

  # Host CLI for account bootstrap. Never started by `make up`. Uses the restricted td_ctl role.
  #   docker compose run --rm -it ctl python scripts/create_admin.py
  #   docker compose run --rm -it ctl python scripts/rotate_admin_password.py
  ctl:
    <<: *hardening
    restart: "no"
    profiles: [ops]
    build: *app-build
    image: tradingdots-app:phase4
    user: "10001:10001"
    command: ["python", "-m", "app.cli", "validate-config"]
    stdin_open: true
    tty: true
    environment:
      TD_ENVIRONMENT: ${TD_ENVIRONMENT:-production}
      TD_APP_HOSTNAME: ${TD_APP_HOSTNAME:?set in .env}
      TD_GRAFANA_HOSTNAME: ${TD_GRAFANA_HOSTNAME:?set in .env}
      TD_SECRET_KEY: ${TD_SECRET_KEY:?set in .env}
      TD_DB_USER: td_ctl
      TD_DB_PASSWORD: ${TD_DB_CTL_PASSWORD:?set in .env}
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    networks: [backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 256m
    pids_limit: 100

  # ---- Pairs (Phase 4): public market-data discovery and validation. Profile "discovery" only ----
  # Never started by `make up`. The runner has no route to the internet: its only way out is the
  # allowlist proxy below, which permits CONNECT to api.coinbase.com:443 and nothing else.
  #   docker compose --profile discovery run --rm pairs discover
  #   docker compose --profile discovery run --rm pairs seed --queue-validation
  #   docker compose --profile discovery run --rm pairs validate
  egress-proxy:
    <<: *hardening
    profiles: [discovery]
    build: *app-build
    image: tradingdots-app:phase4
    user: "10001:10001"
    command: ["python", "-m", "app.adapters.egress_proxy"]
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    networks: [egress_int, egress_ext]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3128), 2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    pids_limit: 50

  pairs:
    <<: *hardening
    restart: "no"
    profiles: [discovery]
    build: *app-build
    image: tradingdots-app:phase4
    user: "10001:10001"
    entrypoint: ["python", "-m", "app.cli", "pairs"]
    command: ["list"]
    environment:
      TD_ENVIRONMENT: ${TD_ENVIRONMENT:-production}
      TD_APP_HOSTNAME: ${TD_APP_HOSTNAME:?set in .env}
      TD_GRAFANA_HOSTNAME: ${TD_GRAFANA_HOSTNAME:?set in .env}
      TD_SECRET_KEY: ${TD_SECRET_KEY:?set in .env}
      TD_DB_USER: td_ctl
      TD_DB_PASSWORD: ${TD_DB_CTL_PASSWORD:?set in .env}
      TD_EGRESS_PROXY: http://egress-proxy:3128
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    networks: [backend, egress_int]
    depends_on:
      migrate: {condition: service_completed_successfully}
      egress-proxy: {condition: service_healthy}
    mem_limit: 256m
    pids_limit: 100

  # ---- Market data, backtests and PAPER trading (Phase 5). Profile "discovery" only -------------
  # Never started by `make up`. Same egress model as `pairs`: public GETs through the allowlist
  # proxy, nothing else. Frozen datasets live in the `datasets` volume at /data (snapshot files are
  # written read-only). Nothing here can place an order on any exchange: the paper venue is the
  # database, and there is no private API client in the image.
  #   docker compose --profile discovery run --rm batch market import --product BTC-USDC
  #   docker compose --profile discovery run --rm batch market import --product BTC-USDC --commit
  #   docker compose --profile discovery run --rm batch market snapshot --product BTC-USDC
  #   docker compose --profile discovery run --rm batch backtest run --snapshot <id>
  #   docker compose --profile discovery run --rm batch paper status
  #   docker compose --profile discovery run --rm batch review build|verify --all|cleanup
  batch:
    <<: *hardening
    restart: "no"
    profiles: [discovery]
    build: *app-build
    image: tradingdots-app:phase4
    user: "10001:10001"
    entrypoint: ["python", "-m", "app.cli"]
    command: ["paper", "status"]
    environment:
      TD_ENVIRONMENT: ${TD_ENVIRONMENT:-production}
      TD_APP_HOSTNAME: ${TD_APP_HOSTNAME:?set in .env}
      TD_GRAFANA_HOSTNAME: ${TD_GRAFANA_HOSTNAME:?set in .env}
      TD_SECRET_KEY: ${TD_SECRET_KEY:?set in .env}
      TD_DB_USER: td_ctl
      TD_DB_PASSWORD: ${TD_DB_CTL_PASSWORD:?set in .env}
      TD_EGRESS_PROXY: http://egress-proxy:3128
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - datasets:/data
      - review_packages:/review   # review packages (read-write here only)
    networks: [backend, egress_int]
    depends_on:
      migrate: {condition: service_completed_successfully}
      egress-proxy: {condition: service_healthy}
    mem_limit: 512m
    pids_limit: 100

  # ---- Monitoring (Phase 3): observational and read-only, nothing here is published ----------
  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.53.0
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=15GB
      - --web.listen-address=:9090
      - --no-web.enable-lifecycle
      - --no-web.enable-admin-api
      - --log.level=info
    volumes:
      - prometheus_data:/prometheus
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./infra/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    networks: [mon_scrape, mon_query]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1536m
    pids_limit: 200

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.8.1
    user: "65534:65534"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($|/)
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    networks: [mon_scrape]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    pids_limit: 50

  grafana:
    <<: *hardening
    image: grafana/grafana-oss:11.1.0
    user: "472"
    environment:
      GF_SECURITY_ADMIN_USER: td-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set in .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # No alert delivery of any kind: Grafana alerting is off, alerts are only displayed.
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_METRICS_ENABLED: "false"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 15s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/overview.json
      GF_SERVER_DOMAIN: ${TD_GRAFANA_HOSTNAME:?set in .env}
      GF_SERVER_ROOT_URL: https://${TD_GRAFANA_HOSTNAME:?set in .env}/
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      GF_PATHS_LOGS: /tmp/grafana-logs
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    networks: [edge_grafana, mon_query]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    pids_limit: 200

  # OPTIONAL (profile "cadvisor", off by default): per-container CPU/memory.
  #   docker compose --profile cadvisor up -d cadvisor
  # It deliberately does NOT mount the Docker socket or /var/lib/docker (either would give a
  # compromised monitoring container control over, or secrets from, every container). Containers
  # are therefore identified by cgroup id, not name. UNTESTED: no Docker daemon was available when
  # this was written. See docs/monitoring.md before enabling.
  cadvisor:
    <<: *hardening
    profiles: [cadvisor]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - --docker_only=false
      - --store_container_labels=false
      - --housekeeping_interval=30s
      - --enable_metrics=cpu,memory,oom_event
      - --listen_ip=0.0.0.0
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    networks: [mon_scrape]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    pids_limit: 100

networks:
  edge_public: {}                    # Caddy only: the sole network with outbound access
  edge_app:                          # Caddy <-> app. Static subnet: the app trusts X-Forwarded-For
    internal: true                   # only from this network (config/base.yaml trusted_proxies)
    ipam:
      config:
        - subnet: 172.29.10.0/24
  edge_grafana: {internal: true}     # Caddy <-> Grafana. Shares nothing with the app.
  backend: {internal: true}          # PostgreSQL, Redis, app (DB only), migrate, ctl
  mon_scrape:                        # Prometheus scrapes app, node-exporter, cAdvisor. Static subnet:
    internal: true                   # the app binds its metrics listener to 172.29.20.10 only.
    ipam:
      config:
        - subnet: 172.29.20.0/24
  mon_query: {internal: true}        # Prometheus <-> Grafana
  egress_int: {internal: true}       # pairs runner <-> egress-proxy (profile discovery)
  egress_ext: {}                     # egress-proxy only: the one allowlisted way to the internet

volumes:
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  redis_data: {}
  prometheus_data: {}
  grafana_data: {}
  datasets: {}                       # frozen Parquet snapshots (batch service only)
  review_packages: {}                # review package ZIPs: batch writes, app reads (read-only mount)
