# Prometheus for TradingDots: observational and read-only.
# - Scrape and evaluation every 15 s. Retention (30 d / 15 GB) is set by command-line flags in
#   docker-compose.yml because it cannot be expressed in this file.
# - There is intentionally NO `alerting:` section (no Alertmanager, no webhook, no e-mail): alerts
#   are only displayed, never delivered. There is no remote_write and no remote_read.
# - Targets are internal service names on the mon_scrape network. Nothing here is published.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The application's internal listener (never routed by Caddy, not the FastAPI port).
  - job_name: tradingdots-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:9464"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # OPTIONAL: only answers when the "cadvisor" compose profile is enabled. The alert rules exclude
  # this job so a disabled cAdvisor never alerts. cAdvisor runs without the Docker socket, so
  # containers are identified by cgroup id. Only a small allowlist of families is kept, only Docker
  # container cgroups, and descriptive labels are dropped.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_usage_bytes|spec_memory_limit_bytes|oom_events_total|last_seen)
        action: keep
      - source_labels: [id]
        regex: /system.slice/docker-[0-9a-f]{64}.scope|/docker/[0-9a-f]{64}
        action: keep
      - regex: name|image|container_label_.*
        action: labeldrop
