# Apache in front of the TradingDots stack. Apache owns the public 80/443 on this server (it also
# serves another site); Caddy listens on loopback 8080/444 only (docker-compose.yml).
#   sudo install -m 644 infra/apache/tradingdots.conf /etc/apache2/sites-available/tradingdots.conf
#   sudo a2enmod proxy proxy_http ssl headers rewrite && sudo a2ensite tradingdots
#   sudo certbot certonly --apache --cert-name tradingdots.onthewall.ovh \
#        -d tradingdots.onthewall.ovh -d grafana.tradingdots.onthewall.ovh \
#        --deploy-hook "systemctl reload apache2"
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# The hostnames must match TD_APP_HOSTNAME and TD_GRAFANA_HOSTNAME in .env.

# Port 80: everything goes to Caddy, which answers its own ACME HTTP-01 challenges and redirects the
# rest to HTTPS. (certbot's temporary challenge rule for Apache's certificate runs before ProxyPass.)
<VirtualHost *:80>
	ServerName tradingdots.onthewall.ovh
	ServerAlias grafana.tradingdots.onthewall.ovh

	ProxyRequests Off
	ProxyPreserveHost On
	# Nothing a visitor sends may pass for proxy information: Caddy trusts these from Apache.
	RequestHeader unset X-Forwarded-For early
	RequestHeader unset X-Forwarded-Host early
	RequestHeader unset X-Forwarded-Proto early
	RequestHeader unset Forwarded early
	ProxyPass / http://127.0.0.1:8080/
	ProxyPassReverse / http://127.0.0.1:8080/

	ErrorLog ${APACHE_LOG_DIR}/tradingdots-error.log
	CustomLog ${APACHE_LOG_DIR}/tradingdots-access.log combined
</VirtualHost>

# Port 443: only once Apache's certificate exists, so the file loads before the first issuance.
<IfFile /etc/letsencrypt/live/tradingdots.onthewall.ovh/fullchain.pem>
<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName tradingdots.onthewall.ovh
	ServerAlias grafana.tradingdots.onthewall.ovh

	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/tradingdots.onthewall.ovh/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/tradingdots.onthewall.ovh/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf

	ProxyRequests Off
	ProxyPreserveHost On
	RequestHeader unset X-Forwarded-For early
	RequestHeader unset X-Forwarded-Host early
	RequestHeader unset X-Forwarded-Proto early
	RequestHeader unset Forwarded early
	RequestHeader set X-Forwarded-Proto "https"

	# TLS again on the loopback hop. Caddy holds its own publicly trusted certificate for the same
	# hostname (the preserved Host is sent as SNI), and it is verified here.
	SSLProxyEngine on
	SSLProxyVerify require
	SSLProxyVerifyDepth 3
	SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
	SSLProxyCheckPeerName on
	SSLProxyCheckPeerExpire on
	ProxyPass / https://127.0.0.1:444/ upgrade=websocket
	ProxyPassReverse / https://127.0.0.1:444/

	ErrorLog ${APACHE_LOG_DIR}/tradingdots-error.log
	CustomLog ${APACHE_LOG_DIR}/tradingdots-access.log combined
</VirtualHost>
</IfModule>
</IfFile>
