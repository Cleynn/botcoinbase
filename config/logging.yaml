version: 1
disable_existing_loggers: false
formatters:
  redacting:
    (): app.logging.RedactingFormatter
    format: "%(asctime)sZ %(levelname)s %(name)s %(message)s"
handlers:
  stdout:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: redacting
  discard:
    class: logging.NullHandler
loggers:
  app:
    level: INFO
    handlers: [stdout]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [stdout]
    propagate: false
  uvicorn.access:
    level: WARNING
    handlers: [discard]
    propagate: false
root:
  level: WARNING
  handlers: [stdout]
