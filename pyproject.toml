[project]
name = "tradingdots"
version = "0.4.0"
description = "TradingDots Phase 1 foundation: deterministic spot-grid research platform shell (BACKTEST/PAPER only, LIVE blocked)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20,<1",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pgserver>=0.1.4",
    "promql-parser>=0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/pending"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S104", "S608"]
"scripts/**" = ["T201"]
"app/cli.py" = ["T201"]
"app/pairs/cli.py" = ["T201"]
"app/storage/database.py" = ["T201"]  # migrate command prints status
# Only fixed column-list constants are interpolated into SQL; all values are bound parameters.
"app/storage/repositories.py" = ["S608"]
"app/storage/pair_repositories.py" = ["S608"]
"app/storage/market_repositories.py" = ["S608", "E501"]
"app/storage/paper_repositories.py" = ["S608", "E501"]
"app/storage/safety_repositories.py" = ["S608", "E501"]
# Report text and operator output lines are long sentences.
"app/reports/builder.py" = ["E501"]
# Regex tables and word lists: long lines are the data; the "secret" words are search terms.
"app/proposals/policy.py" = ["E501", "S105"]
"app/proposals/risk.py" = ["E501"]
"app/batch_cli.py" = ["E501", "T201"]
# Fixed vocabularies of reason codes and blocker sentences.
"app/safety/types.py" = ["E501"]
"app/safety/live_gate.py" = ["E501"]
# Verdict names PASS/FAIL are not credentials; check messages are long human-readable sentences.
"app/pairs/validation.py" = ["S105", "E501"]
# SQL literals in the database-level tests are easier to read on one line.
"tests/integration/test_pair_*.py" = ["E501"]
"tests/integration/test_safety_*.py" = ["E501"]
"tests/unit/test_safety_*.py" = ["E501"]
"tests/unit/test_exchange_boundary.py" = ["E501"]
# Fixed user-facing message catalogues are long sentences.
"app/web/pair_views.py" = ["E501"]
# Enum members named PASSWORD_* are event/permission names, not credentials.
"app/domain/enums.py" = ["S105"]
"app/domain/permissions.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts", "tests"]
exclude = ["tests/pending/"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "app.market.snapshots"
# pyarrow ships partial type information; everything else in this module stays strict.
disable_error_code = ["attr-defined", "no-untyped-call", "no-any-return", "misc"]
